<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeskDesk — shared inbox for support teams</title>
  <meta name="description"
    content="DeskDesk is a small, fast shared inbox: tickets, replies and status, without the bloat." />


  <!-- Theme, before anything paints.

       The site defaults to LIGHT, so the untouched state needs no class and no script to look
       right. This exists only for the visitor who previously chose dark: without it the page
       paints white, React mounts, and the class lands a frame later — a white flash on every
       single load, which is worse than the thing the toggle was added for.

       Reads the same key as src/lib/theme.ts. Keep the two in step. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('deskdesk_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* storage blocked — light is still the right default */ }
    })();
  </script>

  <!-- Preta.

       `d=` MUST be this site's own hostname. It is not decoration: /config?d= keys straight into
       KV as `config:<d>`, so a wrong value serves another tenant's elements inline, and /l/?d=
       picks the loader bundle variant from that same key. The loader's own runtime, meanwhile,
       uses window.location.hostname for everything it does after that — so a mismatch means the
       inline config never matches this page, nothing can paint early from it, and the elements
       only appear after the loader's later /config fetch for the REAL hostname lands. That is a
       whole network round trip after the page has already painted, which is exactly the lateness
       this setup exists to avoid. -->
  <link rel="preconnect" href="https://loader-v1.pretasystems.com" />
  <script src="https://loader-v1.pretasystems.com/config?d=deskreact.vercel.app"></script>
  <script src="https://loader-v1.pretasystems.com/l/pretaloader.js?d=deskreact.vercel.app"
    data-api="https://app.pretasystems.com/v1/api" data-ctx-cookie="preta_ctx" data-debug="true"></script>


</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
